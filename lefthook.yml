pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,json,jsonc,yaml,yml,toml}'
      run: pnpm exec oxfmt --check {staged_files}
    - name: shellcheck
      glob: '*.sh'
      run: pnpm lint:sh
    - name: compose
      glob: '{compose.yml,.env.example}'
      run: pnpm lint:compose
    - name: secrets
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --pre-commit --staged --redact /repo

commit-msg:
  commands:
    'lint commit message':
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: actions
      run: pnpm lint:actions
